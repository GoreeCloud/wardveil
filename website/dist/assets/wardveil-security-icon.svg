<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Wardveil Security — Sentinel Fold</title>
  <desc id="desc">Layered protective veil planes fold around a compact guarded core, forming a restrained W-shaped negative space without using a conventional shield.</desc>
  <defs>
