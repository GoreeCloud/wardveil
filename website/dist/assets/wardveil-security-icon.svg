      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rightVeil" x1="230" y1="42" x2="126" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="foldHighlight" x1="68" y1="70" x2="188" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F7FF" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#BFDBFE" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#DDD6FE" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="coreRing" x1="96" y1="98" x2="161" y2="163" gradientUnits="userSpaceOnUse">
