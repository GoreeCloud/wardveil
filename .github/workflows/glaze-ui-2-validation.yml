name: Validate Security Center Glaze UI 2.1 Stable

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/glaze-ui-2-validation.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/glaze-ui-2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and validate Security Center 2.1 adoption
        run: python3 website/validate.py

      - name: Validate responsive public-document layout
        run: python3 website/validate_responsive.py

      - name: Exercise responsive public-document geometry in Chrome
        run: python3 website/browser_responsive_smoke.py
