name: Evaluate Security Center GLAZE UI V1.2 Candidate

on:
  pull_request:
    paths:
      - "website/GLAZE-UI-V1.2-EVALUATION.md"
      - "website/glaze-ui-v1.2-frosted-neutral.evaluation.css"
      - "website/build_v1_2_evaluation.py"
      - "website/validate_v1_2_evaluation.py"
      - "website/browser_v1_2_evaluation_smoke.py"
      - ".github/workflows/glaze-ui-v1.2-evaluation.yml"
      - "website/index.html"
      - "website/site.css"
      - "website/site.js"
      - "website/glaze-ui-v1.1.0.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wardveil-glaze-v12-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Revalidate active V1.1 production source
        run: python3 website/validate.py

      - name: Validate isolated V1.2 evaluation contract
        run: python3 website/validate_v1_2_evaluation.py

      - name: Exercise V1.2 evaluation in Chrome and capture review evidence
        env:
          WARDVEIL_V12_SCREENSHOT_DIR: website/evidence/v1.2-evaluation
          WARDVEIL_EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 website/browser_v1_2_evaluation_smoke.py

      - name: Upload V1.2 optical review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wardveil-v1.2-frosted-neutral-optical-review
          path: website/evidence/v1.2-evaluation
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
