name: Verify August 24 Security production information

on:
  pull_request:
    paths:
      - ".github/workflows/verify-production-information-refresh.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Security production homepage bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, time
          expected = Path('website/index.html').read_bytes()
          url = 'https://security.goreecloud.com/'
          for attempt in range(1, 7):
              req = Request(url, headers={'User-Agent':'GoreeCloud-Security-Aug24-Production-Verifier/1.0','Accept-Encoding':'identity'})
              with urlopen(req, timeout=15) as response:
                  host = response.geturl().split('/', 3)[2]
                  body = response.read()
                  status = response.status
              if host == 'security.goreecloud.com' and status == 200 and body == expected:
                  print('Security production homepage matches exact August 24 merged source bytes.')
                  break
              if attempt == 6:
                  print(f'status={status} host={host} expected={hashlib.sha256(expected).hexdigest()} actual={hashlib.sha256(body).hexdigest()}')
                  raise SystemExit('Security production verification failed')
              time.sleep(10)
          PY
