name: Deploy Wardveil Scan authenticated transport

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA approved for Wardveil Scan transport deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wardveil-scan-service-production
  cancel-in-progress: false

jobs:
  deploy-and-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: wardveil-production
    env:
      WARDVEIL_VPS_HOST: ${{ secrets.WARDVEIL_VPS_HOST }}
      WARDVEIL_VPS_USER: ${{ secrets.WARDVEIL_VPS_USER }}
      WARDVEIL_VPS_SSH_PRIVATE_KEY: ${{ secrets.WARDVEIL_VPS_SSH_PRIVATE_KEY }}
      WARDVEIL_VPS_SSH_HOST_KEY: ${{ secrets.WARDVEIL_VPS_SSH_HOST_KEY }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify approved main revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify required VPS deployment secrets
        run: |
          set -euo pipefail
          test -n "$WARDVEIL_VPS_HOST"
          test -n "$WARDVEIL_VPS_USER"
          test -n "$WARDVEIL_VPS_SSH_PRIVATE_KEY"
          test -n "$WARDVEIL_VPS_SSH_HOST_KEY"

      - name: Establish pinned SSH host trust
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$WARDVEIL_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/wardveil_vps"
          chmod 0600 "$HOME/.ssh/wardveil_vps"
          printf '%s\n' "$WARDVEIL_VPS_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$WARDVEIL_VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh -i "$HOME/.ssh/wardveil_vps" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$WARDVEIL_VPS_USER@$WARDVEIL_VPS_HOST" 'hostname >/dev/null'

      - name: Build exact-revision deployment bundle
        run: |
          set -euo pipefail
          tar -czf "/tmp/wardveil-scan-${GITHUB_SHA}.tgz" \
            deployment/scan-service \
            reference/wardveil_scan_transport.py \
            reference/wardveil_clamav.py \
            reference/wardveil_clamav_runtime.py \
            reference/wardveil_detect_scan.py \
            scripts/probe_wardveil_scan_service.py
          sha256sum "/tmp/wardveil-scan-${GITHUB_SHA}.tgz" > "/tmp/wardveil-scan-${GITHUB_SHA}.tgz.sha256"

      - name: Transfer deployment bundle
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/wardveil_vps" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "/tmp/wardveil-scan-${GITHUB_SHA}.tgz" "/tmp/wardveil-scan-${GITHUB_SHA}.tgz.sha256" \
            "$WARDVEIL_VPS_USER@$WARDVEIL_VPS_HOST:/tmp/"

      - name: Deploy service and run authenticated clean/EICAR probe
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/wardveil_vps" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$WARDVEIL_VPS_USER@$WARDVEIL_VPS_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          base=/opt/goreecloud/wardveil/scan-service
          release="$base/releases/$revision"
          evidence="$base/evidence/$revision.json"
          archive="/tmp/wardveil-scan-$revision.tgz"
          checksum="$archive.sha256"
          previous=""

          sudo -n true
          command -v python3 >/dev/null
          command -v curl >/dev/null
          command -v sha256sum >/dev/null
          test -f /etc/goreecloud/wardveil/clamav.env
          test -f /etc/goreecloud/wardveil/scan-service.env

          cd /tmp
          sha256sum --check "$checksum"
          if [ -L "$base/current" ]; then previous="$(readlink -f "$base/current" || true)"; fi

          sudo install -d -m 0755 "$base/releases" "$base/evidence"
          sudo rm -rf "$release"
          sudo install -d -m 0755 "$release"
          sudo tar -xzf "$archive" -C "$release"
          sudo chown -R root:root "$release"

          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/goreecloud/wardveil/scan-service.env')
          text = path.read_text()
          line = next((line for line in text.splitlines() if line.startswith('WARDVEIL_SCAN_CALLERS_JSON=')), '')
          if not line:
              raise SystemExit('scan caller credentials are not provisioned')
          value = line.split('=', 1)[1].strip()
          callers = json.loads(value)
          if not isinstance(callers, list) or not callers:
              raise SystemExit('at least one scan caller credential is required')
          for item in callers:
              if len(str(item.get('secret', ''))) < 32:
                  raise SystemExit('scan caller secret is too short')
              if not item.get('resource_types'):
                  raise SystemExit('scan caller resource-type scope is required')
          PY

          if ! id wardveil-scan >/dev/null 2>&1; then
            sudo useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin wardveil-scan
          fi
          sudo ln -sfn "$release" "$base/current"
          sudo install -m 0644 "$release/deployment/scan-service/wardveil-scan.service" /etc/systemd/system/wardveil-scan.service
          sudo systemctl daemon-reload
          sudo systemctl enable wardveil-scan.service >/dev/null
          sudo systemctl restart wardveil-scan.service

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8788/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            sudo journalctl -u wardveil-scan.service --no-pager -n 100 || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              sudo ln -sfn "$previous" "$base/current"
              sudo systemctl restart wardveil-scan.service || true
            fi
            exit 1
          fi

          set +e
          sudo bash -c "set -a; . /etc/goreecloud/wardveil/clamav.env; . /etc/goreecloud/wardveil/scan-service.env; export PYTHONPATH='$release'; export WARDVEIL_SCAN_PROBE_URL='http://127.0.0.1:8788'; python3 '$release/scripts/probe_wardveil_scan_service.py' > '$evidence'"
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              sudo ln -sfn "$previous" "$base/current"
              sudo systemctl restart wardveil-scan.service || true
            else
              sudo systemctl stop wardveil-scan.service || true
            fi
            exit "$probe_rc"
          fi
          sudo chmod 0644 "$evidence"
          sudo rm -f "$archive" "$checksum"
          REMOTE

      - name: Retrieve sanitized transport evidence
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/wardveil_vps" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$WARDVEIL_VPS_USER@$WARDVEIL_VPS_HOST:/opt/goreecloud/wardveil/scan-service/evidence/${GITHUB_SHA}.json" \
            /tmp/wardveil-scan-production-evidence.json
          python3 -m json.tool /tmp/wardveil-scan-production-evidence.json >/dev/null
          grep -q '"authenticated_transport": "passed"' /tmp/wardveil-scan-production-evidence.json
          grep -q '"clean_control": "passed"' /tmp/wardveil-scan-production-evidence.json
          grep -q '"eicar_detection": "passed"' /tmp/wardveil-scan-production-evidence.json
          grep -q '"production_runtime_acceptance": "unaccepted"' /tmp/wardveil-scan-production-evidence.json
          grep -q '"application_consumer_integration": "not_proven_by_probe"' /tmp/wardveil-scan-production-evidence.json

      - name: Record deployment evidence summary
        run: |
          {
            echo '## Wardveil Scan authenticated transport deployment'
            echo
            echo "- Exact deployed source revision: \`$GITHUB_SHA\`"
            echo '- Bind: loopback-only HTTP transport'
            echo '- Authenticated transport probe: passed'
            echo '- Clean control through Wardveil Scan: passed'
            echo '- EICAR detection through Wardveil Scan: passed'
            echo '- Direct ClamAV consumer access: prohibited'
            echo '- Application consumer integration: **not proven by this probe**'
            echo '- Production runtime acceptance: **unaccepted**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/wardveil_vps" "$HOME/.ssh/known_hosts"
