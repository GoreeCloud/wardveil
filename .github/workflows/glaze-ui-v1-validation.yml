name: Validate Security Center historical GLAZE UI V1.1 baseline

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/glaze-ui-v1-validation.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/glaze-ui-v1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-center-glaze-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build and validate Security Center historical GLAZE UI V1.1 baseline
        run: python3 website/validate.py

      - name: Validate responsive public-document layout
        run: python3 website/validate_responsive.py

      - name: Exercise responsive public-document geometry in Chrome
        run: python3 website/browser_responsive_smoke.py
