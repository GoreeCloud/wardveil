name: Deploy Wardveil Cloudflare persistence

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA approved for deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wardveil-cloudflare-persistence-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: wardveil-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WARDVEIL_HEALTH_URL: ${{ secrets.WARDVEIL_HEALTH_URL }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify approved main revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "main" || test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify required deployment secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$WARDVEIL_HEALTH_URL"
          case "$WARDVEIL_HEALTH_URL" in
            https://*/healthz) ;;
            *) echo "WARDVEIL_HEALTH_URL must be an HTTPS /healthz URL" >&2; exit 1 ;;
          esac

      - name: Verify Node runtime
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install exact Wrangler release
        working-directory: cloudflare
        run: npm install --no-save --ignore-scripts wrangler@4.33.1

      - name: Deploy Wardveil persistence Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --location "$WARDVEIL_HEALTH_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q 'goreecloud-wardveil-persistence'

      - name: Verify generic public mutation surface remains absent
        run: |
          set -euo pipefail
          origin="${WARDVEIL_HEALTH_URL%/healthz}"
          code="$(curl --silent --show-error --output /tmp/wardveil-public-mutation-response --write-out '%{http_code}' --request POST "$origin/records" || true)"
          cat /tmp/wardveil-public-mutation-response || true
          case "$code" in
            404|405) ;;
            *) echo "Unexpected public mutation response: HTTP $code" >&2; exit 1 ;;
          esac

      - name: Record deployment evidence summary
        run: |
          {
            echo '## Wardveil Cloudflare persistence deployment'
            echo
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo '- Worker: `goreecloud-wardveil-persistence`'
            echo '- Public health check: passed'
            echo '- Generic public mutation endpoint: absent (404/405)'
            echo '- Runtime status: deployed evidence only; full Wardveil production acceptance still requires the remaining service-binding, retention, PITR, restore, and observability evidence in `contracts/wardveil.cloudflare.runtime-acceptance.json`.'
          } >> "$GITHUB_STEP_SUMMARY"
