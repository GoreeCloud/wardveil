name: Deploy Wardveil Cloudflare persistence

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA approved for deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wardveil-cloudflare-persistence-production
  cancel-in-progress: false

jobs:
  deploy-and-collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: wardveil-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WARDVEIL_HEALTH_URL: ${{ secrets.WARDVEIL_HEALTH_URL }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify approved main revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "main" || test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify required deployment secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$WARDVEIL_HEALTH_URL"
          case "$WARDVEIL_HEALTH_URL" in
            https://*/healthz) ;;
            *) echo "WARDVEIL_HEALTH_URL must be an HTTPS /healthz URL" >&2; exit 1 ;;
          esac

      - name: Verify Node runtime
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install exact Wrangler release with remote-binding support
        working-directory: cloudflare
        run: npm install --no-save --ignore-scripts wrangler@4.37.0

      - name: Deploy Wardveil persistence Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Deploy internal Wardveil acceptance probe
        working-directory: cloudflare
        run: >-
          npx wrangler deploy
          --config acceptance-probe/wrangler.jsonc
          --var EXPECTED_REVISION:$GITHUB_SHA
          --var ACCEPTANCE_TENANT:wardveil-runtime-acceptance

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --location "$WARDVEIL_HEALTH_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q 'goreecloud-wardveil-persistence'

      - name: Verify generic public mutation surface remains absent
        run: |
          set -euo pipefail
          origin="${WARDVEIL_HEALTH_URL%/healthz}"
          code="$(curl --silent --show-error --output /tmp/wardveil-public-mutation-response --write-out '%{http_code}' --request POST "$origin/records" || true)"
          cat /tmp/wardveil-public-mutation-response || true
          case "$code" in
            404|405) ;;
            *) echo "Unexpected public mutation response: HTTP $code" >&2; exit 1 ;;
          esac

      - name: Start local-only acceptance runner with remote service binding
        working-directory: cloudflare
        run: |
          set -euo pipefail
          npx wrangler dev --config acceptance-runner/wrangler.jsonc --ip 127.0.0.1 --port 8788 > /tmp/wardveil-acceptance-runner.log 2>&1 &
          echo $! > /tmp/wardveil-acceptance-runner.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wardveil-acceptance-runner.log >&2
          exit 1

      - name: Collect privileged service-binding and retention evidence
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/wardveil-probe.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"revision\":\"$GITHUB_SHA\"}" \
            http://127.0.0.1:8788/run)"
          cat /tmp/wardveil-probe.json
          test "$code" = "200"

      - name: Collect bounded observability failure evidence
        working-directory: cloudflare
        run: |
          set -euo pipefail
          marker="acceptance-$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          printf '%s' "$marker" > /tmp/wardveil-observability-marker
          npx wrangler tail goreecloud-wardveil-persistence --format json --search "$marker" > /tmp/wardveil-tail.log 2>&1 &
          echo $! > /tmp/wardveil-tail.pid
          sleep 3
          code="$(curl --silent --show-error --output /tmp/wardveil-observability-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"revision\":\"$GITHUB_SHA\",\"marker\":\"$marker\"}" \
            http://127.0.0.1:8788/observe-failure)"
          cat /tmp/wardveil-observability-response.json
          test "$code" = "200"
          grep -q '"expected_failure_observed":true' /tmp/wardveil-observability-response.json
          observed=false
          for attempt in $(seq 1 30); do
            if grep -q "$marker" /tmp/wardveil-tail.log; then
              observed=true
              break
            fi
            sleep 1
          done
          kill "$(cat /tmp/wardveil-tail.pid)" || true
          cat /tmp/wardveil-tail.log
          test "$observed" = "true"

      - name: Build revision-bound runtime evidence manifest
        env:
          EVIDENCE_SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          probe = json.loads(Path('/tmp/wardveil-probe.json').read_text())
          runtime_contract = json.loads(Path('contracts/wardveil.cloudflare.runtime-acceptance.json').read_text())
          sha = os.environ['GITHUB_SHA']
          source = os.environ['EVIDENCE_SOURCE']
          validity_seconds = runtime_contract.get('evidence_validity_seconds')
          if validity_seconds != 3600:
              raise SystemExit('runtime acceptance validity policy must remain exactly one hour')
          collected_at = datetime.datetime.now(datetime.timezone.utc)
          valid_until = collected_at + datetime.timedelta(seconds=validity_seconds)
          now = collected_at.isoformat().replace('+00:00', 'Z')
          expiry = valid_until.isoformat().replace('+00:00', 'Z')

          if probe.get('revision') != sha:
              raise SystemExit('probe revision does not match deployed revision')
          if probe.get('status') != 'unaccepted':
              raise SystemExit('probe must remain unaccepted when no probe failure exists')

          by_requirement = {item['requirement']: item for item in probe['evidence']}
          internal_required = [
              'authorized_append_read',
              'duplicate_record_rejection',
              'checkpoint_non_regression',
              'retention_alarm_evidence',
              'payload_digest_verification',
              'pitr_availability',
          ]
          for requirement in internal_required:
              if by_requirement.get(requirement, {}).get('state') != 'passed':
                  raise SystemExit(f'internal runtime evidence failed: {requirement}')

          observability = json.loads(Path('/tmp/wardveil-observability-response.json').read_text())
          if observability.get('expected_failure_observed') is not True:
              raise SystemExit('bounded observability failure was not observed by the probe')
          marker = Path('/tmp/wardveil-observability-marker').read_text()
          if marker not in Path('/tmp/wardveil-tail.log').read_text():
              raise SystemExit('bounded observability failure marker missing from Cloudflare tail evidence')

          def passed(summary, observed_at=None):
              return {'status': 'passed', 'observed_at': observed_at or now, 'source': source, 'summary': summary}

          def pending(summary):
              return {'status': 'pending', 'observed_at': None, 'source': None, 'summary': summary}

          checks = {
              'deployed_revision_match': passed(f'Deployed workflow and probe are bound to exact revision {sha}.'),
              'health_endpoint': passed('Canonical HTTPS persistence /healthz check passed.'),
              'authorized_append_read': passed('Internal service-binding append/read probe passed.', by_requirement['authorized_append_read']['observed_at']),
              'duplicate_record_rejection': passed('Duplicate record ID rejection probe passed.', by_requirement['duplicate_record_rejection']['observed_at']),
              'checkpoint_non_regression': passed('Consumer checkpoint regression was rejected.', by_requirement['checkpoint_non_regression']['observed_at']),
              'retention_alarm_evidence': passed('A bounded acceptance-tenant Durable Object alarm executed the real retention handler.', by_requirement['retention_alarm_evidence']['observed_at']),
              'payload_digest_verification': passed('Persisted payload digest matched canonical probe payload.', by_requirement['payload_digest_verification']['observed_at']),
              'pitr_availability': passed('Durable Object PITR capability and current bookmark were reported by the runtime.', by_requirement['pitr_availability']['observed_at']),
              'restore_verification_exercise': pending('Requires a separate Everkeep-governed restore verification exercise.'),
              'observability_failure_evidence': passed(f'Controlled failure {marker} was observed through Cloudflare Worker tail evidence.'),
              'public_mutation_surface_absent': passed('Generic public POST /records remained unavailable with HTTP 404/405.'),
          }

          manifest = {
              'schema_version': 1,
              'component': 'Wardveil Cloudflare persistence runtime',
              'environment': 'production',
              'deployed_revision': sha,
              'collected_at': now,
              'valid_until': expiry,
              'acceptance_status': 'unaccepted',
              'checks': checks,
              'storage_health_is_protection_claim': False,
              'everkeep_recovery_authority_preserved': True,
          }
          Path('/tmp/wardveil-runtime-evidence.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Record evidence summary
        run: |
          set -euo pipefail
          {
            echo '## Wardveil Cloudflare runtime evidence collection'
            echo
            echo "- Source/deployed revision: \`$GITHUB_SHA\`"
            echo '- Persistence Worker deployment: completed'
            echo '- Internal acceptance-probe deployment: completed with public routes disabled'
            echo '- Authorized service-binding append/read: passed'
            echo '- Duplicate-record rejection: passed'
            echo '- Checkpoint non-regression: passed'
            echo '- Retention alarm execution: passed in dedicated acceptance tenant'
            echo '- Payload digest verification: passed'
            echo '- PITR capability evidence: passed'
            echo '- Bounded observability failure path: passed through Cloudflare Worker tail evidence'
            echo '- Public health endpoint: passed'
            echo '- Generic public mutation endpoint: absent (404/405)'
            echo '- Producer-declared evidence validity: one hour from manifest collection time'
            echo '- Remaining pending acceptance evidence: Everkeep-governed restore verification'
            echo '- Runtime acceptance status: **unaccepted** until every required check is passed for this exact revision'
            echo
            echo '<details><summary>Machine-readable evidence manifest</summary>'
            echo
            echo '```json'
            cat /tmp/wardveil-runtime-evidence.json
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local acceptance processes
        if: always()
        run: |
          if [ -f /tmp/wardveil-tail.pid ]; then
            kill "$(cat /tmp/wardveil-tail.pid)" || true
          fi
          if [ -f /tmp/wardveil-acceptance-runner.pid ]; then
            kill "$(cat /tmp/wardveil-acceptance-runner.pid)" || true
          fi
