name: Validate Wardveil next-upgrade security state

on:
  pull_request:
    paths:
      - "reference/wardveil_security_state_v2.py"
      - "contracts/wardveil.security-state.v2.schema.json"
      - "contracts/wardveil.protection-coverage.v1.schema.json"
      - "scripts/test_wardveil_security_state_v2.py"
      - "scripts/validate_wardveil_security_state_v2.py"
      - "SECURITY-STATE-V2.md"
      - ".github/workflows/validate-next-upgrade-security-state.yml"
  push:
    branches:
      - main
    paths:
      - "reference/wardveil_security_state_v2.py"
      - "contracts/wardveil.security-state.v2.schema.json"
      - "contracts/wardveil.protection-coverage.v1.schema.json"
      - "scripts/test_wardveil_security_state_v2.py"
      - "scripts/validate_wardveil_security_state_v2.py"
      - "SECURITY-STATE-V2.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test next-upgrade security-state engine
        run: python3 scripts/test_wardveil_security_state_v2.py

      - name: Validate next-upgrade security-state contracts
        run: python3 scripts/validate_wardveil_security_state_v2.py

      - name: Compile next-upgrade source
        run: python3 -m py_compile reference/wardveil_security_state_v2.py scripts/test_wardveil_security_state_v2.py scripts/validate_wardveil_security_state_v2.py
