      - "scripts/validate_wardveil_security_center_v2.py"
      - "scripts/validate_wardveil_identity_key_lifecycle_v1.py"
      - "scripts/validate_wardveil_policy_decision_v2.py"
      - "docs/SECURITY-STATE-V2.md"
      - "docs/PROTECTION-COVERAGE-REGISTRY.md"
