      - "docs/AUDIT-EVIDENCE-LEDGER-V2.md"
      - "docs/SECURITY-CENTER-V2.md"
      - "docs/IDENTITY-KEY-LIFECYCLE-V1.md"
      - "docs/PLATFORM-ADOPTION-AND-REPOSITORY-GOVERNANCE-V1.md"
      - "docs/POLICY-DECISION-AND-ENFORCEMENT-V2.md"
      - "docs/PLANNED-FEATURES.md"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wardveil next-upgrade security state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test next-upgrade security-state engine
        run: python3 scripts/test_wardveil_security_state_v2.py

      - name: Test Protection Coverage Registry
        run: python3 scripts/test_wardveil_protection_coverage_registry.py

      - name: Test durable Quarantine object
        run: python3 scripts/test_wardveil_quarantine_object_v2.py

      - name: Test Incident Plane
        run: python3 scripts/test_wardveil_incident_v2.py

      - name: Test Audit and Evidence Ledger
        run: python3 scripts/test_wardveil_audit_ledger_v2.py

      - name: Test Security Center 2.0 reference model
        run: python3 scripts/test_wardveil_security_center_v2.py

      - name: Test Identity and key lifecycle acceptance model
        run: python3 scripts/test_wardveil_identity_key_lifecycle_v1.py

      - name: Test platform adoption and repository governance
        run: python3 scripts/test_wardveil_platform_adoption_governance_v1.py

      - name: Test Policy Decision and Enforcement Contract
        run: python3 scripts/test_wardveil_policy_decision_v2.py

      - name: Validate next-upgrade security-state and coverage contracts
        run: python3 scripts/validate_wardveil_security_state_v2.py

      - name: Validate next-upgrade Quarantine object contract
        run: python3 scripts/validate_wardveil_quarantine_object_v2.py

      - name: Validate next-upgrade Incident Plane contract
        run: python3 scripts/validate_wardveil_incident_v2.py

      - name: Validate next-upgrade Audit and Evidence Ledger contract
        run: python3 scripts/validate_wardveil_audit_ledger_v2.py

      - name: Validate next-upgrade Security Center 2.0 contract
        run: python3 scripts/validate_wardveil_security_center_v2.py

      - name: Validate Identity and key lifecycle contract
        run: python3 scripts/validate_wardveil_identity_key_lifecycle_v1.py

      - name: Validate Policy Decision and Enforcement Contract
        run: python3 scripts/validate_wardveil_policy_decision_v2.py

      - name: Compile next-upgrade source
        run: >-
          python3 -m py_compile
          reference/wardveil_security_state_v2.py
          reference/wardveil_protection_coverage_registry.py
          reference/wardveil_quarantine_object_v2.py
          reference/wardveil_incident_v2.py
          reference/wardveil_audit_ledger_v2.py
          reference/wardveil_security_center_v2.py
          reference/wardveil_identity_key_lifecycle_v1.py
          reference/wardveil_platform_adoption_governance_v1.py
          reference/wardveil_policy_decision_v2.py
          scripts/test_wardveil_security_state_v2.py
          scripts/test_wardveil_protection_coverage_registry.py
          scripts/test_wardveil_quarantine_object_v2.py
          scripts/test_wardveil_incident_v2.py
          scripts/test_wardveil_audit_ledger_v2.py
          scripts/test_wardveil_security_center_v2.py
          scripts/test_wardveil_identity_key_lifecycle_v1.py
          scripts/test_wardveil_platform_adoption_governance_v1.py
          scripts/test_wardveil_policy_decision_v2.py
          scripts/validate_wardveil_security_state_v2.py
          scripts/validate_wardveil_quarantine_object_v2.py
          scripts/validate_wardveil_incident_v2.py
          scripts/validate_wardveil_audit_ledger_v2.py
          scripts/validate_wardveil_security_center_v2.py
          scripts/validate_wardveil_identity_key_lifecycle_v1.py
          scripts/validate_wardveil_policy_decision_v2.py
