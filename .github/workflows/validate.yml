name: Validate Wardveil foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: wardveil-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate repository governance
        run: python3 scripts/validate_repository_governance.py

      - name: Validate Wardveil foundation
        run: python3 scripts/validate_wardveil.py

      - name: Validate first-party capability architecture
        run: python3 scripts/validate_wardveil_capabilities.py

      - name: Validate runtime security contracts
        run: python3 scripts/validate_wardveil_runtime_contracts.py

      - name: Test Trust and Policy reference SDK
        run: python3 scripts/test_wardveil_decision_reference.py

      - name: Test Wardveil Protect reference executor
        run: python3 scripts/test_wardveil_protect_reference.py

      - name: Test Wardveil Detect and Scan reference SDK
        run: python3 scripts/test_wardveil_detect_scan_reference.py

      - name: Validate evidence validity
        run: python3 scripts/validate_evidence_validity.py

      - name: Validate aggregation conformance
        run: python3 scripts/validate_wardveil_aggregation.py

      - name: Validate Privacy Shield consumer conformance
        run: python3 scripts/validate_wardveil_privacy_shield.py

      - name: Self-test canonical icon validator
        run: python3 scripts/validate_wardveil_icon.py --self-test

      - name: Validate candidate icon safety before canonical promotion
        run: |
          if [ -f branding/wardveil-security-icon.svg ]; then
            echo "Canonical Wardveil icon exists; candidate-only validation is not applicable."
          else
            python3 scripts/validate_wardveil_icon_candidate.py
          fi

      - name: Validate canonical icon state
        run: python3 scripts/validate_wardveil_icon.py

      - name: Compile repository and public-site tooling
        run: python3 -m py_compile reference/wardveil_decision.py reference/wardveil_protect.py reference/wardveil_detect_scan.py scripts/test_wardveil_decision_reference.py scripts/test_wardveil_protect_reference.py scripts/test_wardveil_detect_scan_reference.py scripts/validate_repository_governance.py scripts/validate_evidence_validity.py scripts/validate_wardveil_capabilities.py scripts/validate_wardveil_runtime_contracts.py website/build.py website/validate.py

      - name: Build and validate Wardveil public website
        run: python3 website/validate.py
