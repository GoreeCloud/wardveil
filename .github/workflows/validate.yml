name: Validate Wardveil foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: wardveil-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Wardveil foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Fetch retained public refs for history audit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git remote set-url origin https://github.com/GoreeCloud/wardveil.git
          git fetch --force --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Audit retained public Git history for secrets
        run: python3 scripts/audit_public_git_history.py

      - name: Validate repository governance
        run: python3 scripts/validate_repository_governance.py

      - name: Validate Wardveil foundation
        run: python3 scripts/validate_wardveil.py

      - name: Test Wardveil timestamp boundary containment
        run: python3 scripts/test_wardveil_timestamp_boundaries.py

      - name: Validate first-party capability architecture
        run: python3 scripts/validate_wardveil_capabilities.py

      - name: Validate runtime security contracts
        run: python3 scripts/validate_wardveil_runtime_contracts.py

      - name: Test Trust and Policy reference SDK
        run: python3 scripts/test_wardveil_decision_reference.py

      - name: Test Wardveil Protect reference executor
        run: python3 scripts/test_wardveil_protect_reference.py

      - name: Test Wardveil runtime execution authorization
        run: python3 scripts/test_wardveil_runtime_authorization.py

      - name: Validate Wardveil runtime execution authorization
        run: python3 scripts/validate_wardveil_runtime_authorization.py

      - name: Test Wardveil service identity and key lifecycle
        run: python3 scripts/test_wardveil_service_identity.py

      - name: Validate Wardveil service identity and key lifecycle
        run: python3 scripts/validate_wardveil_service_identity.py

      - name: Test Wardveil durable execution state
        run: python3 scripts/test_wardveil_execution_state.py

      - name: Validate Wardveil durable execution state
        run: python3 scripts/validate_wardveil_execution_state.py

      - name: Test Wardveil quarantine executor
        run: python3 scripts/test_wardveil_quarantine_executor.py

      - name: Validate Wardveil quarantine executor
        run: python3 scripts/validate_wardveil_quarantine_executor.py

      - name: Test Wardveil Detect and Scan reference SDK
        run: python3 scripts/test_wardveil_detect_scan_reference.py

      - name: Test Wardveil ClamAV adapter
        run: python3 scripts/test_wardveil_clamav.py

      - name: Test Wardveil ClamAV runtime health
        run: python3 scripts/test_wardveil_clamav_runtime.py

      - name: Validate Wardveil ClamAV runtime deployment
        run: python3 scripts/validate_wardveil_clamav_runtime.py

      - name: Validate Mail consumer source evidence
        run: python3 scripts/validate_mail_consumer_source_evidence.py

      - name: Validate Drive consumer source evidence
        run: python3 scripts/validate_drive_consumer_source_evidence.py

      - name: Validate Care consumer source evidence
        run: python3 scripts/validate_care_consumer_source_evidence.py

      - name: Test Wardveil Quarantine Audit and Response reference layer
        run: python3 scripts/test_wardveil_incident_reference.py

      - name: Test Wardveil Security Center read model
        run: python3 scripts/test_wardveil_security_center.py

      - name: Test Wardveil cross-service integration pipeline
        run: python3 scripts/test_wardveil_pipeline.py

      - name: Test Wardveil Mesh event transport
        run: python3 scripts/test_wardveil_mesh_transport.py

      - name: Test Wardveil Mesh evidence envelope adapter
        run: python3 scripts/test_wardveil_mesh_evidence.py

      - name: Test Wardveil Mesh runtime acceptance adapter
        run: python3 scripts/test_wardveil_mesh_runtime_acceptance.py

      - name: Test authenticated Wardveil Mesh evidence delivery
        run: python3 scripts/test_wardveil_mesh_delivery.py

      - name: Test durable Wardveil record store
        run: python3 scripts/test_wardveil_store.py

      - name: Test Wardveil persistence abstraction
        run: python3 scripts/test_wardveil_persistence.py

      - name: Validate Wardveil persistence contract
        run: python3 scripts/validate_wardveil_persistence_contract.py

      - name: Test Wardveil persistence production qualification boundary
        run: python3 scripts/test_wardveil_persistence_production_qualification.py

      - name: Validate Wardveil persistence production qualification boundary
        run: python3 scripts/validate_wardveil_persistence_production_qualification.py

      - name: Validate Wardveil Cloudflare persistence adapter
        run: python3 scripts/validate_cloudflare_persistence.py

      - name: Validate Cloudflare authorization issuer candidate
        run: python3 scripts/validate_cloudflare_authorization_issuer.py

      - name: Validate Cloudflare quarantine executor candidate
        run: python3 scripts/validate_cloudflare_quarantine_executor.py

      - name: Validate Cloudflare quarantine executor deployment gate
        run: python3 scripts/validate_cloudflare_quarantine_executor_deployment.py

      - name: Validate Drive quarantine target source evidence
        run: python3 scripts/validate_drive_quarantine_target_source_evidence.py

      - name: Type-check Wardveil Cloudflare Workers
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp" cloudflare/node_modules' EXIT
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.9.2 @cloudflare/workers-types@5.20260827.1 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -s "$tmp/node_modules" cloudflare/node_modules
          "$tmp/node_modules/.bin/tsc" --noEmit -p cloudflare/tsconfig.json
          "$tmp/node_modules/.bin/tsc" --noEmit -p cloudflare/authorization-issuer/tsconfig.json
          "$tmp/node_modules/.bin/tsc" --noEmit -p cloudflare/quarantine-executor/tsconfig.json
          "$tmp/node_modules/.bin/tsc" --noEmit -p cloudflare/quarantine-executor-acceptance-runner/tsconfig.json

      - name: Validate Cloudflare runtime acceptance contract
        run: python3 scripts/validate_wardveil_cloudflare_runtime_acceptance.py

      - name: Validate Cloudflare deployment workflow contract
        run: python3 scripts/validate_cloudflare_deployment_workflow.py

      - name: Validate Cloudflare runtime acceptance evidence model
        run: python3 scripts/validate_wardveil_cloudflare_acceptance_evidence.py

      - name: Validate Cloudflare runtime acceptance probe
        run: python3 scripts/validate_cloudflare_acceptance_probe.py

      - name: Validate Cloudflare runtime evidence collection
        run: python3 scripts/validate_cloudflare_runtime_evidence_collection.py

      - name: Validate Everkeep restore verification consumer
        run: python3 scripts/validate_everkeep_restore_verification_consumer.py

      - name: Validate evidence validity
        run: python3 scripts/validate_evidence_validity.py

      - name: Validate aggregation conformance
        run: python3 scripts/validate_wardveil_aggregation.py

      - name: Validate Privacy Shield consumer conformance
        run: python3 scripts/validate_wardveil_privacy_shield.py

      - name: Validate Privacy Shield producer-source evidence
        run: python3 scripts/validate_privacy_shield_consumer_source_evidence.py

      - name: Test Privacy Shield runtime acceptance boundary
        run: python3 scripts/test_privacy_shield_runtime_acceptance.py

      - name: Validate Privacy Shield runtime acceptance boundary
        run: python3 scripts/validate_privacy_shield_runtime_acceptance.py

      - name: Self-test canonical icon validator
        run: python3 scripts/validate_wardveil_icon.py --self-test

      - name: Validate candidate icon safety before canonical promotion
        run: |
          if [ -f branding/wardveil-security-icon.svg ]; then
            echo "Canonical Wardveil icon exists; candidate-only validation is not applicable."
          else
            python3 scripts/validate_wardveil_icon_candidate.py
          fi

      - name: Validate canonical icon state
        run: python3 scripts/validate_wardveil_icon.py

      - name: Compile repository and public-site tooling
        run: python3 -m py_compile reference/wardveil_decision.py reference/wardveil_protect.py reference/wardveil_runtime_authorization.py reference/wardveil_service_identity.py reference/wardveil_execution_state.py reference/wardveil_quarantine_executor.py reference/wardveil_detect_scan.py reference/wardveil_clamav.py reference/wardveil_clamav_runtime.py reference/wardveil_incident.py reference/wardveil_security_center.py reference/wardveil_pipeline.py reference/wardveil_mesh_transport.py reference/wardveil_mesh_evidence.py reference/wardveil_mesh_runtime_acceptance.py reference/wardveil_mesh_delivery.py reference/wardveil_store.py reference/wardveil_persistence.py scripts/test_wardveil_decision_reference.py scripts/test_wardveil_protect_reference.py scripts/test_wardveil_runtime_authorization.py scripts/validate_wardveil_runtime_authorization.py scripts/test_wardveil_service_identity.py scripts/validate_wardveil_service_identity.py scripts/test_wardveil_execution_state.py scripts/validate_wardveil_execution_state.py scripts/test_wardveil_quarantine_executor.py scripts/validate_wardveil_quarantine_executor.py scripts/validate_cloudflare_quarantine_executor.py scripts/validate_cloudflare_quarantine_executor_deployment.py scripts/validate_mail_consumer_source_evidence.py scripts/validate_drive_consumer_source_evidence.py scripts/validate_care_consumer_source_evidence.py scripts/validate_drive_quarantine_target_source_evidence.py scripts/test_wardveil_detect_scan_reference.py scripts/test_wardveil_clamav.py scripts/test_wardveil_clamav_runtime.py scripts/collect_wardveil_clamav_health.py scripts/validate_wardveil_clamav_runtime.py scripts/test_wardveil_incident_reference.py scripts/test_wardveil_security_center.py scripts/test_wardveil_pipeline.py scripts/test_wardveil_mesh_transport.py scripts/test_wardveil_mesh_evidence.py scripts/test_wardveil_mesh_runtime_acceptance.py scripts/test_wardveil_mesh_delivery.py scripts/test_wardveil_store.py scripts/test_wardveil_persistence.py scripts/validate_wardveil_persistence_contract.py scripts/test_wardveil_persistence_production_qualification.py scripts/validate_wardveil_persistence_production_qualification.py scripts/validate_cloudflare_persistence.py scripts/validate_cloudflare_authorization_issuer.py scripts/validate_wardveil_cloudflare_runtime_acceptance.py scripts/validate_cloudflare_deployment_workflow.py scripts/validate_wardveil_cloudflare_acceptance_evidence.py scripts/validate_cloudflare_acceptance_probe.py scripts/validate_cloudflare_runtime_evidence_collection.py scripts/validate_everkeep_restore_verification_consumer.py scripts/validate_privacy_shield_consumer_source_evidence.py scripts/test_privacy_shield_runtime_acceptance.py scripts/validate_privacy_shield_runtime_acceptance.py scripts/audit_public_git_history.py scripts/validate_repository_governance.py scripts/validate_evidence_validity.py scripts/validate_wardveil_capabilities.py scripts/validate_wardveil_runtime_contracts.py scripts/test_wardveil_timestamp_boundaries.py website/build.py website/validate.py

      - name: Build and validate Wardveil public website
        run: python3 website/validate.py
