name: Validate Wardveil Platform Registry delivery

on:
  pull_request:
    paths:
      - "reference/wardveil_platform_registry_delivery.py"
      - "scripts/test_wardveil_platform_registry_delivery.py"
      - ".github/workflows/validate-platform-registry-delivery.yml"
  push:
    branches: [main]
    paths:
      - "reference/wardveil_platform_registry_delivery.py"
      - "scripts/test_wardveil_platform_registry_delivery.py"
      - ".github/workflows/validate-platform-registry-delivery.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wardveil Platform Registry delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile Platform Registry transport
        run: python3 -m py_compile reference/wardveil_platform_registry_delivery.py scripts/test_wardveil_platform_registry_delivery.py

      - name: Test producer-bound Platform Registry delivery
        run: python3 scripts/test_wardveil_platform_registry_delivery.py
