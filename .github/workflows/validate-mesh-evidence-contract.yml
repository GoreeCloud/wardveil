name: Validate pinned Wardveil Mesh evidence contract source

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: wardveil-mesh-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pinned Wardveil Mesh evidence contract source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Wardveil source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Wardveil source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve pinned GoreeCloud Mesh evidence contract revision
        id: mesh-evidence-contract
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          profile = json.loads(
              Path("contracts/wardveil.mesh-evidence-profile.json").read_text(encoding="utf-8")
          )
          envelope_revision = profile["mesh_envelope"]["revision"]
          platform_revision = profile["platform_evidence_plane"]["revision"]
          if envelope_revision != platform_revision:
              raise SystemExit("Wardveil Mesh profile revisions disagree")
          if re.fullmatch(r"[0-9a-f]{40}", envelope_revision) is None:
              raise SystemExit("Wardveil Mesh profile revision is not immutable")
          print(f"revision={envelope_revision}")
          PY

      - name: Check out pinned GoreeCloud Mesh evidence contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GoreeCloud/goreecloud-mesh
          ref: ${{ steps.mesh-evidence-contract.outputs.revision }}
          path: .contract-sources/goreecloud-mesh
          persist-credentials: false

      - name: Validate pinned GoreeCloud Mesh contract source
        run: python3 scripts/validate_wardveil_mesh_contract_source.py

      - name: Enforce runtime assertion producer binding regressions
        run: python3 scripts/test_wardveil_mesh_assertion_binding.py

      - name: Enforce dedicated runtime acceptance producer binding regressions
        run: python3 scripts/test_wardveil_mesh_runtime_acceptance.py

      - name: Compile pinned Mesh source-contract and assertion-binding validators
        run: |
          python3 -m py_compile scripts/validate_wardveil_mesh_contract_source.py
          python3 -m py_compile scripts/test_wardveil_mesh_assertion_binding.py
          python3 -m py_compile scripts/test_wardveil_mesh_runtime_acceptance.py
          python3 -m py_compile reference/wardveil_mesh_runtime_acceptance.py
