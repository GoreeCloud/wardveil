name: Validate authenticated Wardveil Scan transport

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: wardveil-scan-service-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate JSON contracts and sanitized examples
        run: |
          set -euo pipefail
          python3 -m json.tool contracts/wardveil.scan-service-transport.json >/dev/null
          python3 -m json.tool deployment/scan-service/scan-callers.example.json >/dev/null

      - name: Compile authenticated Scan transport
        run: |
          set -euo pipefail
          python3 -m py_compile \
            reference/wardveil_scan_service.py \
            reference/wardveil_scan_replay.py \
            scripts/serve_wardveil_scan.py \
            scripts/probe_wardveil_scan_service.py \
            scripts/accept_wardveil_scan_replay_restart.py \
            scripts/accept_wardveil_scan_credential_revocation.py \
            scripts/accept_wardveil_scan_capacity.py \
            scripts/test_wardveil_scan_service.py \
            scripts/test_wardveil_scan_replay.py \
            scripts/test_wardveil_scan_replay_restart_acceptance.py \
            scripts/test_wardveil_scan_credential_revocation_acceptance.py \
            scripts/test_wardveil_scan_capacity_acceptance.py \
            scripts/validate_wardveil_scan_service.py \
            scripts/validate_wardveil_scan_replay.py \
            scripts/validate_wardveil_scan_replay_restart_acceptance.py \
            scripts/validate_wardveil_scan_credential_revocation_acceptance.py \
            scripts/validate_wardveil_scan_capacity_acceptance.py

      - name: Test authenticated Scan transport
        run: python3 scripts/test_wardveil_scan_service.py

      - name: Test durable Scan replay state
        run: python3 scripts/test_wardveil_scan_replay.py

      - name: Test replay restart acceptance helpers
        run: python3 scripts/test_wardveil_scan_replay_restart_acceptance.py

      - name: Test credential revocation acceptance helpers
        run: python3 scripts/test_wardveil_scan_credential_revocation_acceptance.py

      - name: Test capacity acceptance helpers
        run: python3 scripts/test_wardveil_scan_capacity_acceptance.py

      - name: Validate deployment and acceptance boundaries
        run: |
          set -euo pipefail
          python3 scripts/validate_wardveil_scan_service.py
          python3 scripts/validate_wardveil_scan_replay.py
          python3 scripts/validate_wardveil_scan_replay_restart_acceptance.py

      - name: Validate credential revocation acceptance wiring
        run: python3 scripts/validate_wardveil_scan_credential_revocation_acceptance.py

      - name: Validate capacity acceptance wiring
        run: python3 scripts/validate_wardveil_scan_capacity_acceptance.py
