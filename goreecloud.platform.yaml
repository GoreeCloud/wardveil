conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SECURITY.md
    - RUNTIME-AUTHORIZATION.md
    - EXECUTION-STATE.md
    - SERVICE-IDENTITY.md
    - contracts/wardveil.capabilities.json
    - contracts/wardveil.execution-state.json
    - contracts/wardveil.mesh-evidence-profile.json
    - reference/wardveil_sqlite_execution_state.py
    - reference/wardveil_mesh_delivery.py
    - reference/wardveil_platform_registry_delivery.py
    - scripts/test_wardveil_sqlite_execution_state.py
    - scripts/test_wardveil_platform_registry_delivery.py
    - website/GLAZE-UI-V1.6-ADOPTION.md
  blockers:
    - Wardveil Foundation 0.9 is classified Weave: the core security architecture substantially exists, while overall production runtime acceptance and release convergence remain blocked even though bounded Wardveil Scan runtime and consumer scopes have exact-environment evidence.
    - GoreeCloud Manager integration and acceptance for Wardveil service state are not established.
    - Source-scoped GoreeCloud Identity credential boundaries are implemented, but production service identity, issuance, signing-key lifecycle, deployed JWKS trust, credential rotation/revocation, approved cryptography, and key management remain incomplete.
    - Privacy Shield integration and production acceptance remain incomplete.
    - Single-host durable execution-state and restart-safe reconciliation are implemented and exact-head tested, but accepted Everkeep recovery, target-side readback, distributed/multi-host replay guarantees, and broader production durability remain incomplete.
    - Source-level Mesh evidence and Platform Registry clients are implemented and exact-head validated, but live producer identity, routing, publication, delivery, and end-to-end Mesh acceptance remain production-unaccepted.
    - Security Center source now targets GLAZE UI V1.6 / 1.6.0, but final human rendered review, accessibility, representative-target/performance, rollback, deployment, deployed-byte/provenance, consumer-registry, and production consumer acceptance remain open.
    - Authorized Quarantine execution, external target readback/idempotency, authoritative Audit/Security Center provenance, and broader protection-claim authority remain unaccepted.
    - GoreeCloud Policy integration remains blocked pending an accepted platform Policy runtime contract plus Wardveil-specific decision, distribution, enforcement-coordination, and evidence acceptance.
    - GoreeCloud Observability integration remains blocked pending an accepted platform Observability runtime contract plus Wardveil-specific health, telemetry, freshness, completeness, diagnostics, and operational-evidence acceptance.
    - Any required multi-host capacity acceptance, Seal candidate identity, and final Anchor qualification remain open.
