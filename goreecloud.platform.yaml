schema_version: '0.2'

component:
  type: service
  id: goreecloud-wardveil-security
  product_name: Wardveil Security
  repository: GoreeCloud/goreecloud-wardveil-security

lifecycle: development
version: '0.9'

supported_platforms:
  - linux
  - web

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: GoreeCloud Manager integration for Wardveil inventory, lifecycle, coverage, health, evidence, and bounded administrative state is required but no accepted current Manager integration is established.
  privacy_shield:
    result: applicable-migration-required
    version: null
    evidence:
      - README.md
      - contracts/wardveil.mesh-evidence-profile.json
    notes: Wardveil source architecture preserves Privacy Shield as the separate privacy and data-use authority, but live Privacy Shield integration and production acceptance remain open.
  wardveil_security:
    result: not-applicable-justified
    version: '0.9'
    evidence:
      - README.md
      - contracts/wardveil.capabilities.json
    notes: This repository implements the Wardveil Security authority itself; a separate Wardveil-to-Wardveil platform integration is not applicable.
  everkeep:
    result: applicable-migration-required
    version: null
    evidence:
      - README.md
      - contracts/wardveil.mesh-evidence-profile.json
      - reference/wardveil_sqlite_execution_state.py
    notes: Wardveil now has source-validated single-host durable execution-state persistence and restart-safe replay/reconciliation semantics, while Everkeep remains the recovery authority and live Everkeep backup/restore integration and production acceptance remain incomplete.
  glaze_ui:
    result: applicable-migration-required
    version: '2.1.0'
    evidence:
      - website/GLAZE-UI-2.1-ADOPTION.md
      - website/glaze-ui-2.1.0.css
    notes: Security Center still carries source-level pre-reset Glaze UI 2.1.0 adoption evidence. The current Platform Contract consumer baseline is GLAZE UI V1.1 / 1.1.0; the upstream 1.1.1 corrective Release Candidate has repaired import closure but is not yet immutable Stable authority, so current-contract re-pin, human/rendered acceptance, and production consumer acceptance remain separate.
  mesh:
    result: applicable-migration-required
    version: null
    evidence:
      - contracts/wardveil.mesh-evidence-profile.json
      - reference/wardveil_mesh_delivery.py
      - reference/wardveil_platform_registry_delivery.py
    notes: Wardveil implements source-validated minimized Mesh security-evidence delivery and producer-bound Platform Registry publication with scoped Identity credentials, producer/receipt binding, authority_transfer=false, and secret-safe error handling. Live producer identity, target routing, delivery, registry publication, and end-to-end production acceptance remain required.
    capabilities:
      - security-evidence-producer
      - platform-registry-producer
      - trust-evaluation
      - policy-decision
      - scan-finding
      - protection-result
    dependencies:
      - goreecloud-identity
      - goreecloud-mesh
    published_events: []
    consumed_events: []
  identity:
    result: applicable-migration-required
    version: null
    evidence:
      - README.md
      - contracts/wardveil.mesh-evidence-profile.json
      - reference/wardveil_mesh_delivery.py
      - reference/wardveil_platform_registry_delivery.py
    notes: Wardveil implements source-validated narrowly scoped credential-provider boundaries for Mesh evidence and Platform Registry publication, while GoreeCloud Identity remains authoritative for production service identity, issuance, signing keys, JWKS trust, rotation/revocation, approved cryptography, and key management; those deployed acceptance gates remain open.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect durable Wardveil policy, trust, execution-state, replay, audit, quarantine, incident, service-identity, signing-key metadata, and required security evidence state according to approved retention and privacy boundaries.
      - The current SQLite execution-state implementation provides exact-head validated same-host durability and restart-safe replay/idempotency state; it is not a substitute for accepted Everkeep backup and recovery.
      - Protect configuration and state needed to restore Wardveil services without placing reusable credentials or private key material in ordinary evidence or Git history.
  restore:
    required: true
    requirements:
      - Validate isolated Everkeep-backed restoration of Wardveil durable state, replay protection, execution reconciliation, policy behavior, audit provenance, and required Scan service state before broad production dependence.
      - Require Wardveil verification of restored security-sensitive services while preserving Everkeep as the recovery authority.
  export:
    required: true
    requirements:
      - Provide documented minimized export or migration paths for Wardveil-owned policy, audit, evidence, incident, quarantine, and configuration state without exporting reusable secrets or raw protected content as ordinary data.
  portability:
    required: true
    requirements:
      - Keep Wardveil contracts and security-engine boundaries replaceable so the platform is not permanently coupled to ClamAV or another single scanning, persistence, or execution implementation.

external_dependencies:
  - name: ClamAV
    purpose: Current replaceable malware-scanning engine beneath Wardveil Scan; it does not define Wardveil security authority or the long-term Scan contract.
    required: false
    version_constraint: null
  - name: SQLite
    purpose: Durable same-host replay and execution-state persistence used by the current Wardveil Scan runtime path.
    required: true
    version_constraint: null

compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.1.0'
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - wardveil-security-foundation-0.9
    - wardveil-mesh-evidence-profile-v1
    - wardveil-scan
    - wardveil-durable-execution-state-single-host
    - wardveil-platform-registry-delivery

evidence:
  acceptance_tests:
    - scripts/test_wardveil_execution_state.py
    - scripts/test_wardveil_sqlite_execution_state.py
    - scripts/test_wardveil_mesh_delivery.py
    - scripts/test_wardveil_platform_registry_delivery.py
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SECURITY.md
    - RUNTIME-AUTHORIZATION.md
    - EXECUTION-STATE.md
    - SERVICE-IDENTITY.md
    - contracts/wardveil.capabilities.json
    - contracts/wardveil.execution-state.json
    - contracts/wardveil.mesh-evidence-profile.json
    - reference/wardveil_sqlite_execution_state.py
    - reference/wardveil_mesh_delivery.py
    - reference/wardveil_platform_registry_delivery.py
    - scripts/test_wardveil_sqlite_execution_state.py
    - scripts/test_wardveil_platform_registry_delivery.py
    - website/GLAZE-UI-2.1-ADOPTION.md
  blockers:
    - Wardveil Foundation 0.9 remains in Active Development and overall production runtime acceptance remains unaccepted even though bounded Wardveil Scan runtime and consumer scopes have exact-environment evidence.
    - GoreeCloud Manager integration and acceptance for Wardveil service state are not established.
    - Source-scoped GoreeCloud Identity credential boundaries are implemented, but production service identity, issuance, signing-key lifecycle, deployed JWKS trust, credential rotation/revocation, approved cryptography, and key management remain incomplete.
    - Privacy Shield integration and production acceptance remain incomplete.
    - Single-host durable execution-state and restart-safe reconciliation are implemented and exact-head tested, but accepted Everkeep recovery, target-side readback, distributed/multi-host replay guarantees, and broader production durability remain incomplete.
    - Source-level Mesh evidence and Platform Registry clients are implemented and exact-head validated, but live producer identity, routing, publication, delivery, and end-to-end Mesh acceptance remain production-unaccepted.
    - Security Center requires current-contract Glaze UI reconciliation plus final human, rendered, deployment, provenance, and production consumer acceptance; corrected GLAZE UI V1.1.1 is not yet immutable Stable authority.
    - Authorized Quarantine execution, external target readback/idempotency, authoritative Audit/Security Center provenance, and broader protection-claim authority remain unaccepted.
    - Any required multi-host capacity acceptance and final Stable qualification remain open.
