health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: true
    requirements:
      - Protect durable Wardveil policy, trust, execution-state, replay, audit, quarantine, incident, service-identity, signing-key metadata, and required security evidence state according to approved retention and privacy boundaries.
      - The current SQLite execution-state implementation provides exact-head validated same-host durability and restart-safe replay/idempotency state; it is not a substitute for accepted Everkeep backup and recovery.
      - Protect configuration and state needed to restore Wardveil services without placing reusable credentials or private key material in ordinary evidence or Git history.
  restore:
    required: true
    requirements:
      - Validate isolated Everkeep-backed restoration of Wardveil durable state, replay protection, execution reconciliation, policy behavior, audit provenance, and required Scan service state before broad production dependence.
      - Require Wardveil verification of restored security-sensitive services while preserving Everkeep as the recovery authority.
  export:
    required: true
    requirements:
      - Provide documented minimized export or migration paths for Wardveil-owned policy, audit, evidence, incident, quarantine, and configuration state without exporting reusable secrets or raw protected content as ordinary data.
  portability:
    required: true
    requirements:
      - Keep Wardveil contracts and security-engine boundaries replaceable so the platform is not permanently coupled to ClamAV or another single scanning, persistence, or execution implementation.

external_dependencies:
  - name: ClamAV
    purpose: Current replaceable malware-scanning engine beneath Wardveil Scan; it does not define Wardveil security authority or the long-term Scan contract.
    required: false
    version_constraint: null
  - name: SQLite
    purpose: Durable same-host replay and execution-state persistence used by the current Wardveil Scan runtime path.
    required: true
    version_constraint: null

